<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DailySpend</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Full-screen wrapper to center the card on the page -->
    <div class="auth-wrapper">

        <!-- Login Card Container -->
        <div class="auth-card">

            <!-- Brand & Description Header -->
            <div class="auth-header">
                <h1>DailySpend</h1>
                <p>Login to manage your daily budget</p>
            </div>

            <!-- Alert box to display validation errors dynamically using JavaScript -->
            <div id="alert" class="alert alert-danger"></div>

            <!-- Login Form -->
             <form id="loginForm">

                <!-- Email Input Group -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
                </div>

                <!-- Password Input Group -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <!-- Navigation to the Register Page -->
            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>

        </div>
    </div>

    <!-- Link to Login JavaScript Logic -->
    <script src="js/login.js"></script>
</body>
</html>
