<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DailySpend</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body> 
    <!-- Header Section -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <h2>DailySpend</h2> <!--Logo/Title-->
            </div>
            <div class="user-nav">
                <!--Placeholder for username-->
                <span class="user-name" id="welcomeText">Welcome, User!</span>
                <button id="logoutBtn" class="btn btn-logout">Logout</button>
            </div>
        </div>
    </header>

    <!--Main Section-->
    <main class="dashboard-container">
        <!--1. Statistics Summary Grid (3 Cards)-->
        <section class="summary-grid">
            <!-- Income Card -->
            <div class="summary-card income">
                <span class="summary-label">Total Income</span>
                <span class="summary-amount" id="totalIncome">&#8360; 0.00</span>
            </div>

            <!-- Expense Card-->
            <div class="summary-card expense">
                <span class="summary-label">Total Expenses</span>
                <span class="summary-amount" id="totalExpenses">&#8360; 0.00</span>
            </div>

            <!-- Net Balance Card-->
            <div class="summary-card balance">
                <span class="summary-label">Current Balance</span>
                <span class="summary-amount" id="currentBalance">&#8360; 0.00</span>
            </div>
        </section>

        <!-- 2. Workspace Grid -->
        <section class="dashboard-workspace">

            <!-- LEFT COLUMN: Form to Add/Edit Transactions -->
            <div class="card">
                <h3 class="card-title" id="formTitle">Add New Transaction</h3>

                <form id="transactionForm">

                    <!-- Hidden Input to track if we are Editing an existing transaction -->
                    <input type="hidden" id="editingId" value="">

                    <!-- Transaction Title -->
                    <div class="form-group">
                        <label for="transTitle">Transaction Title</label>
                        <input type="text" id="transTitle" class="form-control" placeholder="e.g., Grocery Shopping" required>
                    </div>

                    <!-- Transaction Amount -->
                    <div class="form-group">
                        <label for="transAmount">Amount (Rs.)</label>
                        <input type="number" id="transAmount" class="form-control" placeholder="e.g., 45.50" step="0.01" required>
                    </div>

                     <!-- Transaction Type (Income vs Expense) -->
                    <div class="form-group">
                        <label for="transType">Transaction Type</label>
                        <select id="transType" class="form-control" required>
                            <option value="" disabled selected>Select Type</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <!-- Category -->
                    <div class="form-group">
                        <label for="transCategory">Category</label>
                        <select id="transCategory" class="form-control" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Rent">Rent</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Date -->
                    <div class="form-group">
                        <label for="transDate">Date</label>
                        <input type="date" id="transDate" class="form-control" required>
                    </div>

                    <!-- Action Buttons (Add/Save and Cancel) -->
                    <div class="form-actions">
                        <button type="submit" id="submitBtn" class="btn btn-primary">Add Transaction</button>
                        <!-- Cancel edit button (hidden by default, displayed only when editing) -->
                        <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
                    </div>

                </form>
            </div>

            <!-- RIGHT COLUMN: Filters and Transaction History -->
            <div>

                <!-- Filters bar: Search input and filter dropdowns -->
                <div class="filter-bar">
                    <!-- Text Search Filter -->
                    <input type="text" id="searchVal" class="form-control" placeholder="Search by title...">
                    
                    <!-- Category Filter -->
                    <select id="filterCategory" class="form-control">
                        <option value="all">All Categories</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Rent">Rent</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Other">Other</option>
                    </select>

                    <!-- Type Filter -->
                    <select id="filterType" class="form-control">
                        <option value="all">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <!-- Transactions Container -->
                <div class="card">
                    <h3 class="card-title">Transaction History</h3>

                    <!-- This div is populated dynamically by dashboard.js -->
                    <div id="transactionList" class="transactions-wrapper">
                        <!-- Dynamic transactions go here, or the empty state placeholder below -->
                        <div class="empty-state" id="emptyState">
                            No transactions found. Add a transaction to get started!
                        </div>
                    </div>

                </div>

            </div>
        </section>
    </main>

    <!-- Link to Dashboard JavaScript Logic -->
    <script src="js/dashboard.js"></script>
</body>
</html>
